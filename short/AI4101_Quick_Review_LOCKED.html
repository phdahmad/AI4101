<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI4101 — Quick Review (محمي)</title>
<style>

  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449;
    --accent:#38bdf8; --accent2:#a78bfa; --good:#34d399; --warn:#fbbf24;
    --text:#e2e8f0; --muted:#94a3b8; --border:#334155;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    background:linear-gradient(160deg,#0f172a,#111c33); color:var(--text);
    line-height:1.8; padding:0 0 60px;
  }
  header{
    text-align:center; padding:30px 16px 20px; position:relative;
    background:linear-gradient(135deg,#1e3a5f,#3b2a63);
    border-bottom:2px solid var(--accent);
  }
  header h1{margin:0 0 6px; font-size:clamp(20px,4vw,32px)}
  header p{margin:0; color:#cbd5e1; font-size:15px}
  .langbtn{
    position:absolute; top:16px; inset-inline-end:16px;
    background:var(--accent); color:#062033; border:none; font-weight:bold;
    padding:8px 16px; border-radius:999px; cursor:pointer; font-size:14px;
  }
  .langbtn:hover{filter:brightness(1.08)}
  .wrap{max-width:1000px; margin:0 auto; padding:0 16px}

  .tabs{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    position:sticky; top:0; z-index:20; padding:14px 8px;
    background:rgba(15,23,42,.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
  }
  .tab{
    cursor:pointer; border:1px solid var(--border); background:var(--card);
    color:var(--text); padding:8px 14px; border-radius:999px; font-size:14px;
    transition:.2s; white-space:nowrap;
  }
  .tab:hover{border-color:var(--accent)}
  .tab.active{background:var(--accent); color:#062033; font-weight:bold; border-color:var(--accent)}

  .view{display:none; animation:fade .3s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  h2.topic{
    font-size:21px; color:var(--accent); border-inline-start:5px solid var(--accent2);
    padding:6px 12px; margin:28px 0 12px; background:rgba(56,189,248,.07); border-radius:8px;
  }
  .concept{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:14px 18px; margin:12px 0;
  }
  .concept h3{margin:10px 0 6px; color:var(--accent2); font-size:17px}
  .concept h3:first-child{margin-top:0}
  .concept p{margin:6px 0; color:var(--text)}
  .key{color:var(--good); font-weight:bold}
  .tip{
    background:rgba(167,139,250,.1); border-inline-start:4px solid var(--accent2);
    padding:8px 12px; border-radius:6px; margin-top:10px; font-size:14px; color:#ddd6fe;
  }
  .warn{
    background:rgba(251,191,36,.1); border-inline-start:4px solid var(--warn);
    padding:8px 12px; border-radius:6px; margin:8px 0; font-size:14px; color:#fde68a;
  }
  table{width:100%; border-collapse:collapse; margin:10px 0; font-size:14px}
  th,td{border:1px solid var(--border); padding:7px 9px}
  html[dir=rtl] th,html[dir=rtl] td{text-align:right}
  html[dir=ltr] th,html[dir=ltr] td{text-align:left}
  th{background:var(--card2); color:var(--accent)}
  code{background:#0b1220; padding:2px 6px; border-radius:5px; color:#7dd3fc; font-size:13px}
  pre{background:#0b1220; padding:12px; border-radius:8px; overflow:auto; color:#cbd5e1; direction:ltr; text-align:left}

  /* Flashcards */
  .cards-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px}
  .flip{perspective:1200px; height:185px; cursor:pointer}
  .flip-inner{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d}
  .flip.flipped .flip-inner{transform:rotateY(180deg)}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:14px;
    padding:16px; display:flex; flex-direction:column; justify-content:center;
    border:1px solid var(--border);
  }
  .front{background:linear-gradient(150deg,#1e293b,#243149)}
  .front .q{font-size:15px; font-weight:bold}
  .front .hint{position:absolute; bottom:10px; inset-inline-end:14px; font-size:11px; color:var(--muted)}
  .back{background:linear-gradient(150deg,#10362b,#0f2f3a); transform:rotateY(180deg); border-color:var(--good)}
  .back .a{font-size:14.5px}
  .badge{font-size:11px; color:var(--accent); margin-bottom:6px}
  .controls{text-align:center; margin:10px 0 20px}
  .controls button{
    background:var(--card2); color:var(--text); border:1px solid var(--border);
    padding:8px 16px; border-radius:8px; cursor:pointer; margin:0 4px; font-size:13px;
  }
  .controls button:hover{border-color:var(--accent)}
  .note{color:var(--muted); font-size:13px; text-align:center; margin-top:4px}
  footer{text-align:center; color:var(--muted); font-size:13px; margin-top:40px}

/* ---- lock screen ---- */
#lock{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 30%,#16233f,#0b1424);}
#lockbox{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:34px 28px;
  width:min(420px,92vw); text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.4)}
#lockbox .lk{font-size:40px; margin-bottom:6px}
#lockbox h2{margin:0 0 4px; color:var(--accent); font-size:21px}
#lockbox p{margin:0 0 18px; color:var(--muted); font-size:14px}
#sid{width:100%; padding:12px 14px; font-size:18px; text-align:center; letter-spacing:2px;
  border-radius:10px; border:1px solid var(--border); background:#0b1220; color:var(--text); direction:ltr}
#sid:focus{outline:none; border-color:var(--accent)}
#go{margin-top:14px; width:100%; padding:12px; font-size:16px; font-weight:bold; cursor:pointer;
  border:none; border-radius:10px; background:var(--accent); color:#062033}
#go:hover{filter:brightness(1.08)}
#go:disabled{opacity:.6; cursor:wait}
#err{color:#f87171; font-size:14px; margin-top:12px; min-height:18px}
#app{display:none}
#whoami{position:absolute; top:16px; inset-inline-start:16px; font-size:13px; color:#cbd5e1;
  background:rgba(0,0,0,.25); padding:6px 12px; border-radius:999px}
</style>
</head>
<body>

<div id="lock">
  <div id="lockbox">
    <div class="lk">🔒</div>
    <h2>محتوى محمي · Protected</h2>
    <p>أدخل رقمك الجامعي للدخول<br>Enter your university ID</p>
    <input id="sid" inputmode="numeric" autocomplete="off" placeholder="● ● ● ● ● ●" />
    <button id="go" onclick="unlock()">دخول · Enter</button>
    <div id="err"></div>
  </div>
</div>

<div id="app">
  <header>
    <button class="langbtn" id="langBtn" onclick="toggleLang()">English</button>
    <span id="whoami"></span>
    <h1 id="hTitle"></h1>
    <p id="hSub"></p>
  </header>

  <div class="tabs">
    <div class="tab active" data-view="concepts" id="tabConcepts"></div>
    <div class="tab" data-view="cards" id="tabCards"></div>
    <div class="tab" data-view="types" id="tabTypes"></div>
  </div>

  <div class="wrap">
    <div class="view active" id="concepts"></div>
    <div class="view" id="cards">
      <div class="controls">
        <button onclick="flipAll(true)" id="btnFlipAll"></button>
        <button onclick="flipAll(false)" id="btnUnflip"></button>
      </div>
      <p class="note" id="cardsNote"></p>
      <div class="cards-grid" id="grid"></div>
    </div>
    <div class="view" id="types"></div>
  </div>

  <footer id="foot"></footer>
</div>

let UI, TOPICS, CARDS, TYPES;
let STUDENT = "";

/* ---- render engine (provided after unlock) ---- */
let LANG = "ar";
function block(b){
  if(b.t==="pre") return `<pre>${b.text}</pre>`;
  if(b.t==="h3") return `<h3>${b[LANG]}</h3>`;
  if(b.t==="p") return `<p>${b[LANG]}</p>`;
  if(b.t==="tip") return `<div class="tip">${b[LANG]}</div>`;
  if(b.t==="warn") return `<div class="warn">${b[LANG]}</div>`;
  if(b.t==="table"){
    const rows=b[LANG];
    let h="<table>";
    rows.forEach((r,i)=>{ h+="<tr>"; r.forEach(c=> h+= i===0?`<th>${c}</th>`:`<td>${c}</td>`); h+="</tr>"; });
    return h+"</table>";
  }
  return "";
}
function renderConcepts(){
  let h="";
  TOPICS.forEach(tp=>{
    h+=`<h2 class="topic">${tp.title[LANG]}</h2><div class="concept">`;
    tp.blocks.forEach(b=> h+=block(b));
    h+="</div>";
  });
  document.getElementById("concepts").innerHTML=h;
}
function renderTypes(){
  let h="";
  TYPES.forEach(s=>{
    h+=`<div class="concept"><h3>${s.h[LANG]}</h3>`;
    s.body.forEach(b=> h+=block(b));
    h+="</div>";
  });
  document.getElementById("types").innerHTML=h;
}
function renderCards(){
  const grid=document.getElementById("grid"); grid.innerHTML="";
  CARDS.forEach(card=>{
    const d=document.createElement("div"); d.className="flip";
    d.innerHTML=`<div class="flip-inner">
      <div class="face front"><div class="badge">${card.c[LANG]}</div><div class="q">${card.q[LANG]}</div><div class="hint">${UI[LANG].hint}</div></div>
      <div class="face back"><div class="badge">${UI[LANG].answer}</div><div class="a">${card.a[LANG]}</div></div>
    </div>`;
    d.onclick=()=>d.classList.toggle("flipped");
    grid.appendChild(d);
  });
}
function applyLang(){
  const u=UI[LANG];
  document.documentElement.lang=u.lang;
  document.documentElement.dir=u.dir;
  document.getElementById("langBtn").textContent=u.btn;
  document.getElementById("hTitle").textContent=u.title;
  document.getElementById("hSub").textContent=u.sub;
  const tabs=document.querySelectorAll(".tab");
  tabs[0].textContent=u.tabs[0]; tabs[1].textContent=u.tabs[1]; tabs[2].textContent=u.tabs[2];
  document.getElementById("btnFlipAll").textContent=u.flipAll;
  document.getElementById("btnUnflip").textContent=u.unflip;
  document.getElementById("cardsNote").textContent=u.cardsNote;
  document.getElementById("foot").textContent=u.foot;
  renderConcepts(); renderTypes(); renderCards();
}
function toggleLang(){ LANG = LANG==="ar"?"en":"ar"; applyLang(); }

// Tabs
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById(t.dataset.view).classList.add("active");
    window.scrollTo({top:0,behavior:"smooth"});
  };
});
function flipAll(s){document.querySelectorAll(".flip").forEach(c=>c.classList.toggle("flipped",s));}


/* ---- crypto unlock ---- */
const _dec = (b64s)=>Uint8Array.from(atob(b64s), c=>c.charCodeAt(0));
async function _derive(id, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(id), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:BLOB.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
async function unlock(){
  const id = document.getElementById("sid").value.trim();
  const err = document.getElementById("err");
  const go = document.getElementById("go");
  err.textContent="";
  if(!id){ err.textContent="أدخل الرقم الجامعي · Enter your ID"; return; }
  go.disabled=true; go.textContent="جارٍ التحقق… · Checking…";
  let ok=false;
  for(const w of BLOB.wraps){
    try{
      const wk = await _derive(id, _dec(w.salt));
      const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:_dec(w.iv)}, wk, _dec(w.ct));
      const {k, n} = JSON.parse(new TextDecoder().decode(buf));
      const ck = await crypto.subtle.importKey("raw", _dec(k), {name:"AES-GCM"}, false, ["decrypt"]);
      const cbuf = await crypto.subtle.decrypt({name:"AES-GCM", iv:_dec(BLOB.iv0)}, ck, _dec(BLOB.content));
      const DATA = JSON.parse(new TextDecoder().decode(cbuf));
      UI=DATA.UI; TOPICS=DATA.TOPICS; CARDS=DATA.CARDS; TYPES=DATA.TYPES; STUDENT=n;
      ok=true; break;
    }catch(e){ /* wrong id for this wrap */ }
  }
  if(!ok){
    go.disabled=false; go.textContent="دخول · Enter";
    err.textContent="رقم غير صحيح أو غير مسجّل · Invalid or unregistered ID";
    return;
  }
  document.getElementById("lock").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("whoami").textContent="👤 "+STUDENT;
  applyLang();
}
document.getElementById("sid").addEventListener("keydown", e=>{ if(e.key==="Enter") unlock(); });
</script>
